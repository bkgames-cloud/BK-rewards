apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// React Native community CLI autolinking (PackageList / native modules)
apply from: new File(["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json')"].execute(null, null).text.trim(), "../native_modules.gradle");
applyNativeModulesAppBuildGradle(project)

// React Native (react.gradle)
try {
    apply from: new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), "../react.gradle")
} catch (Throwable ignored) {
    // node_modules absent : sera résolu après npm/yarn install
}

// Expo (scripts Gradle)
try {
    apply from: new File(["node", "--print", "require.resolve('expo/package.json')"].execute(null, rootDir).text.trim(), "../scripts/expo.gradle")
} catch (Throwable ignored) {
    // Certains templates n'ont pas expo.gradle ; l'autolinking via settings.gradle suffit.
}

// Expo Modules autolinking (ajoute les dépendances qui fournissent `expo.modules.*`)
def expoAutolinkingFromNodeModules = new File(rootProject.projectDir, "../node_modules/expo/scripts/autolinking.gradle")
if (expoAutolinkingFromNodeModules.exists()) {
    apply from: expoAutolinkingFromNodeModules
} else {
    try {
        apply from: new File(["node", "--print", "require.resolve('expo/package.json')"].execute(null, rootProject.projectDir).text.trim(), "../scripts/autolinking.gradle")
    } catch (Throwable ignored) {
        // node_modules absent : sera résolu après npm/yarn install
    }
}

// On force le chemin de node ici pour corriger ProcessOutputValueSource
// bundleInDebug : le JS est packagé dans l’APK même en debug (pas de Metro / 10.0.2.2:8081).
project.ext.react = [
    nodeExecutableAndArgs: ["/usr/local/bin/node"],
    bundleInDebug: true,
]

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    namespace "com.bk.rewards"

    buildFeatures {
        buildConfig = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        dex {
            useLegacyPackaging = false
        }
    }

    defaultConfig {
        applicationId "com.bk.rewards"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        missingDimensionStrategy 'store', 'play'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

// JavaScriptCore (fallback si Hermes désactivé)
def jscFlavor = 'org.webkit:android-jsc:+'

dependencies {
    // Le moteur de React Native
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    implementation project(':react-native-webview')
    implementation project(':react-native-iap')
}
